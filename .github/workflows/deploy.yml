name: Deploy Vite Super App to GitHub Pages

on:
  push:
    branches: [ main ] # Sesuaikan dengan branch utama Anda

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and Build Client App
        run: |
          echo "Memeriksa direktori client..."
          cd client
          if [ -f "package.json" ]; then
            echo "package.json ditemukan. Menjalankan instalasi dependensi..."
            npm install
            echo "Menjalankan build Vite..."
            npm run build
          else
            echo "❌ ERROR: package.json tidak ditemukan di dalam folder client!"
            exit 1
          fi

      - name: Setup Pages Environment
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
